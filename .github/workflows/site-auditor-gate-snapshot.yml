name: Site Auditor Gate Snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/site-auditor-gate-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TARGET_SHA: 896f8ef2ed6d14f907e729c352d020cba4cac59a
      TARGET_REPO: Dimar4713/AIMETON_site_auditor
    steps:
      - name: Inspect exact SHA and global convergence concurrency
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail-with-body --silent --show-error --max-time 30 "${headers[@]}" \
            "https://api.github.com/repos/$TARGET_REPO/actions/runs?head_sha=$TARGET_SHA&per_page=100" > "$RUNNER_TEMP/exact.json"
          curl --fail-with-body --silent --show-error --max-time 30 "${headers[@]}" \
            "https://api.github.com/repos/$TARGET_REPO/actions/workflows/stage-convergence.yml/runs?per_page=20" > "$RUNNER_TEMP/convergence.json"
          python3 - "$RUNNER_TEMP/exact.json" "$RUNNER_TEMP/convergence.json" "$TARGET_SHA" <<'PY'
          import json, sys
          exact_path, conv_path, sha=sys.argv[1:]
          exact=[r for r in json.load(open(exact_path,encoding='utf-8')).get('workflow_runs',[]) if r.get('head_sha')==sha]
          print(f'TARGET_SHA={sha}')
          for name in ['Baseline CI','Deploy Stage','Configure DaData Stage','Runtime Persistence Reconcile','Stage Auth Persistence Guard']:
              ms=sorted([r for r in exact if r.get('name')==name], key=lambda r:r.get('created_at') or '', reverse=True)
              print(f"{name}=" + ('missing' if not ms else f"run_id:{ms[0].get('id')} status:{ms[0].get('status')} conclusion:{ms[0].get('conclusion')}"))
          print('GLOBAL_STAGE_CONVERGENCE_RECENT:')
          runs=json.load(open(conv_path,encoding='utf-8')).get('workflow_runs',[])
          for r in runs:
              print(f"  run_id:{r.get('id')} sha:{r.get('head_sha')} status:{r.get('status')} conclusion:{r.get('conclusion')} event:{r.get('event')} created:{r.get('created_at')} updated:{r.get('updated_at')}")
          PY
