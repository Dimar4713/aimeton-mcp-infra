name: Site Auditor Convergence Holder Snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/site-auditor-gate-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TARGET_REPO: Dimar4713/AIMETON_site_auditor
      TARGET_SHA: f17c721aafaac0117da2a4208fc0bbca9081231a
    steps:
      - name: Print recent convergence runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$TARGET_REPO/actions/workflows/stage-convergence.yml/runs?per_page=20" > "$RUNNER_TEMP/runs.json"
          python3 - "$RUNNER_TEMP/runs.json" "$TARGET_SHA" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1],encoding='utf-8')); target=sys.argv[2]
          for r in payload.get('workflow_runs',[]):
              print(f"run={r.get('id')} sha={r.get('head_sha')} status={r.get('status')} conclusion={r.get('conclusion')} created={r.get('created_at')} target={r.get('head_sha')==target}")
          PY
