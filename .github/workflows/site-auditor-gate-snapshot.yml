name: Site Auditor RouterAI Diagnostics Comment Reader

on:
  pull_request:
    paths:
      - ".github/workflows/site-auditor-gate-snapshot.yml"

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TARGET_REPO: Dimar4713/AIMETON_site_auditor
      TARGET_SHA: 896f8ef2ed6d14f907e729c352d020cba4cac59a
    steps:
      - name: Print latest sanitized Stage mission diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$TARGET_REPO/issues/177/comments?per_page=100" \
            > "$RUNNER_TEMP/comments.json"
          python3 - "$RUNNER_TEMP/comments.json" "$TARGET_SHA" <<'PY'
          import json, sys
          path, sha = sys.argv[1:]
          comments = json.load(open(path, encoding='utf-8'))
          matches=[]
          for c in comments:
              body=c.get('body') or ''
              if body.startswith('## Stage mission diagnostics') and sha in body:
                  matches.append((c.get('created_at') or '', c.get('id'), body))
          if not matches:
              raise SystemExit('no matching sanitized diagnostics comment')
          created, cid, body = sorted(matches)[-1]
          print(f'COMMENT_ID={cid}')
          print(f'CREATED_AT={created}')
          for line in body.splitlines():
              if line.startswith('- latest failed RouterAI phase trace:') or line.startswith('- deployed source SHA:') or line.startswith('- container state:') or line.startswith('- health state:'):
                  print(line)
          PY
