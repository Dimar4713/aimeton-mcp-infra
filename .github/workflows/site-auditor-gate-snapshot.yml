name: Site Auditor Gate Snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/site-auditor-gate-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TARGET_SHA: 896f8ef2ed6d14f907e729c352d020cba4cac59a
      TARGET_REPO: Dimar4713/AIMETON_site_auditor
    steps:
      - name: Print exact-SHA workflow topology
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$TARGET_REPO/actions/runs?head_sha=$TARGET_SHA&per_page=100" \
            > "$RUNNER_TEMP/runs.json"
          python3 - "$RUNNER_TEMP/runs.json" "$TARGET_SHA" <<'PY'
          import json, sys
          path, sha=sys.argv[1:]
          names=['Baseline CI','Deploy Stage','Configure DaData Stage','Runtime Persistence Reconcile','Stage Auth Persistence Guard','Stage Convergence']
          runs=[r for r in json.load(open(path,encoding='utf-8')).get('workflow_runs',[]) if r.get('head_sha')==sha]
          print(f'TARGET_SHA={sha}')
          for name in names:
              matches=sorted([r for r in runs if r.get('name')==name], key=lambda r:r.get('created_at') or '', reverse=True)
              if not matches:
                  print(f'{name}=missing')
                  continue
              r=matches[0]
              print(f"{name}=run_id:{r.get('id')} status:{r.get('status')} conclusion:{r.get('conclusion')} event:{r.get('event')} created:{r.get('created_at')}")
          PY
