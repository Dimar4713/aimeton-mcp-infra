name: Site Auditor RouterAI Paid Acceptance Observer

on:
  pull_request:
    paths:
      - ".github/workflows/site-auditor-gate-snapshot.yml"

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_SHA: f17c721aafaac0117da2a4208fc0bbca9081231a
      TARGET_REPO: Dimar4713/AIMETON_site_auditor
      NOT_BEFORE_UTC: 2026-08-18T10:20:00Z
    steps:
      - name: Wait for exact-SHA RouterAI acceptance completion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/$TARGET_REPO/actions/workflows/accept-routerai-synthesis-stage.yml/runs?event=workflow_dispatch&per_page=30"
          deadline=$((SECONDS + 420))
          while (( SECONDS < deadline )); do
            curl --fail-with-body --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" > "$RUNNER_TEMP/runs.json"
            result="$(python3 - "$RUNNER_TEMP/runs.json" "$TARGET_SHA" "$NOT_BEFORE_UTC" <<'PY'
          import json, sys
          path, sha, not_before=sys.argv[1:]
          candidates=[r for r in json.load(open(path,encoding='utf-8')).get('workflow_runs',[])
                      if r.get('head_sha')==sha and (r.get('created_at') or '') >= not_before]
          if not candidates:
              print('NONE')
          else:
              r=sorted(candidates,key=lambda x:x.get('created_at') or '',reverse=True)[0]
              print('|'.join([str(r.get('id')),str(r.get('status')),str(r.get('conclusion')),str(r.get('run_number')),str(r.get('created_at'))]))
          PY
          )"
            echo "ROUTERAI_ACCEPTANCE=$result"
            if [[ "$result" != NONE ]]; then
              IFS='|' read -r run_id status conclusion run_number created_at <<< "$result"
              if [[ "$status" == completed ]]; then
                echo "RUN_ID=$run_id"
                echo "CONCLUSION=$conclusion"
                exit 0
              fi
            fi
            sleep 8
          done
          exit 2
