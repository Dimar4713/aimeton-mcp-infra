name: Site Auditor RouterAI Acceptance Observer

on:
  pull_request:
    paths:
      - ".github/workflows/site-auditor-gate-snapshot.yml"

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_SHA: 1128b64d3bc401f64842aef49d7d78a6b5d60715
      TARGET_REPO: Dimar4713/AIMETON_site_auditor
      WORKFLOW_NAME: Accept RouterAI Synthesis Stage
    steps:
      - name: Wait for one exact-SHA paid acceptance run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          deadline=$((SECONDS + 660))
          chosen=''
          while (( SECONDS < deadline )); do
            curl --fail-with-body --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$TARGET_REPO/actions/runs?head_sha=$TARGET_SHA&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/runs.json"
            chosen="$(python3 - "$RUNNER_TEMP/runs.json" "$TARGET_SHA" "$WORKFLOW_NAME" <<'PY'
          import json,sys
          path,sha,name=sys.argv[1:]
          runs=[r for r in json.load(open(path,encoding='utf-8')).get('workflow_runs',[]) if r.get('head_sha')==sha and r.get('name')==name]
          runs=sorted(runs,key=lambda r:r.get('created_at') or '',reverse=True)
          if not runs: print('MISSING'); raise SystemExit
          r=runs[0]
          print(f"{r.get('id')}|{r.get('status')}|{r.get('conclusion')}|{r.get('created_at')}")
          PY
          )"
            echo "$chosen"
            case "$chosen" in
              MISSING) sleep 8 ;;
              *'|completed|success|'*) exit 0 ;;
              *'|completed|'*) exit 3 ;;
              *) sleep 8 ;;
            esac
          done
          echo 'acceptance run did not reach terminal state' >&2
          exit 2
