name: Site Auditor Diagnostics Observer

on:
  pull_request:
    paths:
      - ".github/workflows/site-auditor-convergence-probe.yml"

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: 1a1e12c3664c717d5a3c2833a6d7829d755c2173
      TARGET_REPO: Dimar4713/AIMETON_site_auditor
      WORKFLOW_FILE: stage-mission-diagnostics.yml
      NOT_BEFORE_UTC: 2026-08-18T03:31:00Z
    steps:
      - name: Wait for exact-SHA Stage diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/$TARGET_REPO/actions/workflows/$WORKFLOW_FILE/runs?event=workflow_dispatch&per_page=20"
          deadline=$((SECONDS + 240))
          while (( SECONDS < deadline )); do
            curl --fail-with-body --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" > "$RUNNER_TEMP/runs.json"
            result="$(python3 - "$RUNNER_TEMP/runs.json" "$TARGET_SHA" "$NOT_BEFORE_UTC" <<'PY'
          import json, sys
          path, sha, not_before = sys.argv[1:]
          payload = json.load(open(path, encoding='utf-8'))
          candidates = [r for r in payload.get('workflow_runs', [])
                        if r.get('head_sha') == sha and (r.get('created_at') or '') >= not_before]
          if not candidates:
              print('NONE')
          else:
              r = sorted(candidates, key=lambda x: x.get('created_at') or '', reverse=True)[0]
              print('|'.join([str(r.get('id')), str(r.get('status')), str(r.get('conclusion')),
                              str(r.get('created_at')), str(r.get('run_number'))]))
          PY
          )"
            echo "observer=$result"
            if [[ "$result" != NONE ]]; then
              IFS='|' read -r run_id status conclusion created_at run_number <<< "$result"
              if [[ "$status" == completed ]]; then
                echo "DIAGNOSTIC_RUN_ID=$run_id"
                echo "DIAGNOSTIC_STATUS=$status"
                echo "DIAGNOSTIC_CONCLUSION=$conclusion"
                echo "DIAGNOSTIC_CREATED_AT=$created_at"
                echo "DIAGNOSTIC_RUN_NUMBER=$run_number"
                exit 0
              fi
            fi
            sleep 8
          done
          exit 2
