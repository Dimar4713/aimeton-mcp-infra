name: Site Auditor Exact-SHA Convergence Observer

on:
  pull_request:
    paths:
      - ".github/workflows/site-auditor-convergence-probe.yml"

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: 1128b64d3bc401f64842aef49d7d78a6b5d60715
      TARGET_REPO: Dimar4713/AIMETON_site_auditor
      STAGE_URL: https://stage-auditor.aimeton.ru
    steps:
      - name: Wait for exact-SHA Stage convergence chain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          deadline=$((SECONDS + 840))
          required=(
            'Baseline CI'
            'Deploy Stage'
            'Configure DaData Stage'
            'Runtime Persistence Reconcile'
            'Stage Auth Persistence Guard'
            'Stage Convergence'
          )
          while (( SECONDS < deadline )); do
            curl --fail-with-body --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$TARGET_REPO/actions/runs?head_sha=$TARGET_SHA&per_page=100" \
              > "$RUNNER_TEMP/runs.json"
            status="$(python3 - "$RUNNER_TEMP/runs.json" "$TARGET_SHA" <<'PY'
          import json, sys
          path, sha = sys.argv[1:]
          required = [
              'Baseline CI', 'Deploy Stage', 'Configure DaData Stage',
              'Runtime Persistence Reconcile', 'Stage Auth Persistence Guard',
              'Stage Convergence',
          ]
          runs = [r for r in json.load(open(path, encoding='utf-8')).get('workflow_runs', []) if r.get('head_sha') == sha]
          latest = {}
          for r in sorted(runs, key=lambda x: x.get('created_at') or ''):
              latest[r.get('name')] = r
          parts = []; all_green = True; fatal = False
          for name in required:
              r = latest.get(name)
              if r is None:
                  parts.append(f'{name}=missing'); all_green = False; continue
              state = f"{r.get('status')}/{r.get('conclusion')}#{r.get('id')}"
              parts.append(f'{name}={state}')
              if r.get('status') != 'completed' or r.get('conclusion') != 'success': all_green = False
              if r.get('status') == 'completed' and r.get('conclusion') not in (None, 'success'): fatal = True
          print(('GREEN' if all_green else 'FATAL' if fatal else 'WAIT') + '|' + ';'.join(parts))
          PY
          )"
            echo "$status"
            case "$status" in
              GREEN\|*) break ;;
              FATAL\|*) echo 'exact-SHA convergence chain contains a failed gate' >&2; exit 3 ;;
            esac
            sleep 12
          done
          [[ "$status" == GREEN\|* ]]
      - name: Verify canonical public convergence marker
        shell: bash
        run: |
          set -Eeuo pipefail
          snapshot="$(curl --fail-with-body --silent --show-error --max-time 30 "$STAGE_URL/api/runtime/convergence")"
          python3 - "$snapshot" "$TARGET_SHA" <<'PY'
          import json, sys
          payload=json.loads(sys.argv[1]); sha=sys.argv[2]
          safe={k:payload.get(k) for k in ('state','deployment_sha','converged_at_utc','marker_error','secrets_exposed')}
          print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          assert payload.get('state') == 'converged', safe
          assert payload.get('deployment_sha') == sha, safe
          assert payload.get('marker_error') is None, safe
          assert payload.get('secrets_exposed') is False, safe
          PY
